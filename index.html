<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Beautiful Life</title>
	<link rel="icon" href="icon.png">
	<link rel="apple-touch-icon" href="icon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">

	  
    <style>
     body { font-family: 'Poiret One', sans-serif; font-size: 19px; }
	 h1, h2 { font-weight: normal; }
 	 input, button, textarea { font: inherit; }
		table { border-collapse: collapse; }
      td { padding: 6px 10px; text-align: center; }
      td:first-child {
        text-align: left;
        position: sticky;
        left: 0;
        background: white;
      }
      tr:first-child { font-weight: normal; }
      .remove { border: none; background: none; color: gray; cursor: pointer; }
      textarea { width: 100%; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <h1>My Beautiful Life</h1>
    <p id="intro">Things I want to prioritize</p>

    <div style="overflow-x: auto;">
      <table id="grid"></table>
    </div>

    <form id="addForm">
      <input type="text" id="newName" placeholder="New priority">
      <button type="submit">Add</button>
    </form>

    <div id="monthEnd" hidden>
      <h2>Reflection</h2>
      <textarea id="reflection" rows="6" placeholder="How did the month go?"></textarea>

      <h2>Carry over to the new month</h2>
      <div id="carryList"></div>

      <p><button id="startMonth">Start new month</button></p>
    </div>

	<h2>Backup</h2>
	<p>
 	 <button id="backupButton">Save backup</button>
 	 <button id="restoreButton">Restore from backup</button>
 	 <input type="file" id="restoreFile" hidden>
	</p>
	  
    <script>
      // The date the page treats as "now".
      const now = new Date();
	  // const now = new Date(2026, 11, 1);

      // Turns a date into text like "2026-11-16"
      function dateText(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return year + '-' + month + '-' + day;
      }

      // Load the saved list. The very first time there is none,
      // so start with these three.
      let activities = JSON.parse(localStorage.getItem('activities'));
	  if (activities === null) {
		activities = [];
	  }

      function saveActivities() {
        localStorage.setItem('activities', JSON.stringify(activities));
      }

      // Which month are we tracking? Text like "2026-11".
      const thisMonth = dateText(now).slice(0, 7);
      let savedMonth = localStorage.getItem('currentMonth');
      if (savedMonth === null) {
        savedMonth = thisMonth;
        localStorage.setItem('currentMonth', savedMonth);
      }

      // If the tracked month is not the real month, it is time to look back.
      const reviewing = savedMonth !== thisMonth;

      // The days to show, latest first
      function daysToShow() {
        const parts = savedMonth.split('-');
        const year = Number(parts[0]);
        const monthIndex = Number(parts[1]) - 1;

        let lastDay;
        if (reviewing) {
          // Looking back: show the whole month
          lastDay = new Date(year, monthIndex + 1, 0).getDate();
        } else {
          // Normal: show up to today
          lastDay = now.getDate();
        }

        const days = [];
        for (let d = lastDay; d >= 1; d--) {
          days.push(new Date(year, monthIndex, d));
        }
        return days;
      }

      // Builds the whole table from scratch
      function drawGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        const days = daysToShow();

        // Top row: an empty corner, then one cell per day
        const headerRow = grid.insertRow();
        headerRow.insertCell();
        days.forEach(function (date) {
          const weekday = date.toLocaleDateString(undefined, { weekday: 'short' });
          headerRow.insertCell().innerHTML = weekday + '<br>' + date.getDate();
        });

        // One row per activity
        activities.forEach(function (activity) {
          const row = grid.insertRow();

          const nameCell = row.insertCell();
          nameCell.textContent = activity.name + ' ';

          // The remove button, except while looking back
          if (!reviewing) {
            const removeButton = document.createElement('button');
            removeButton.textContent = '×';
            removeButton.className = 'remove';
            removeButton.addEventListener('click', function () {
              if (confirm('Remove "' + activity.name + '"?')) {
                activities = activities.filter(function (a) {
                  return a.id !== activity.id;
                });
                saveActivities();
                drawGrid();
              }
            });
            nameCell.appendChild(removeButton);
          }

          // One checkbox per day
          days.forEach(function (date) {
            const key = dateText(date) + '-' + activity.id;

            const box = document.createElement('input');
            box.type = 'checkbox';
            box.checked = localStorage.getItem(key) === 'yes';
            box.addEventListener('change', function () {
              localStorage.setItem(key, box.checked ? 'yes' : 'no');
            });

            row.insertCell().appendChild(box);
          });
        });
      }

      // When the form is submitted, add the new priority
      document.getElementById('addForm').addEventListener('submit', function (event) {
        event.preventDefault();

        const input = document.getElementById('newName');
        const name = input.value.trim();
        if (name === '') {
          return;
        }

        activities.push({ id: 'a' + Date.now(), name: name });
        saveActivities();
        drawGrid();
        input.value = '';
      });

      // Sets up the look-back screen
      function showMonthEnd() {
        const monthName = daysToShow()[0].toLocaleDateString(undefined,
          { month: 'long', year: 'numeric' });
        document.getElementById('intro').textContent =
          'Looking back at ' + monthName + '. Fill in any days you missed, then reflect below.';

        document.getElementById('addForm').hidden = true;
        document.getElementById('monthEnd').hidden = false;

        // The reflection box: load anything already written, save while typing
        const reflection = document.getElementById('reflection');
        const reflectionKey = 'reflection-' + savedMonth;
        reflection.value = localStorage.getItem(reflectionKey) || '';
        reflection.addEventListener('input', function () {
          localStorage.setItem(reflectionKey, reflection.value);
        });

        // One "carry over" tick per priority, ticked to begin with
        const carryList = document.getElementById('carryList');
        activities.forEach(function (activity) {
          const label = document.createElement('label');
          const box = document.createElement('input');
          box.type = 'checkbox';
          box.id = 'carry-' + activity.id;
          box.checked = true;
          label.appendChild(box);
          label.appendChild(document.createTextNode(' ' + activity.name));
          carryList.appendChild(label);
          carryList.appendChild(document.createElement('br'));
        });

        // The button: keep a copy of last month's list, then start fresh
        document.getElementById('startMonth').addEventListener('click', function () {
          localStorage.setItem('activities-' + savedMonth, JSON.stringify(activities));

          activities = activities.filter(function (activity) {
            return document.getElementById('carry-' + activity.id).checked;
          });
          saveActivities();

          localStorage.setItem('currentMonth', thisMonth);
          location.reload();
        });
      }

  // Save backup: collect everything in storage into one file
	document.getElementById('backupButton').addEventListener('click', function () {
	  const data = {};
	  for (let i = 0; i < localStorage.length; i++) {
 	   const key = localStorage.key(i);
  	  if (!key.startsWith('sleep-')) {
 	 data[key] = localStorage.getItem(key);
	}
 	 }

  const fileName = 'tracker-backup-' + dateText(new Date()) + '.txt';
  const file = new File([JSON.stringify(data, null, 2)], fileName,
    { type: 'text/plain' });

  // On phones, open the share sheet. Otherwise, download the file.
  const onPhone = /Android|iPhone|iPad/.test(navigator.userAgent);
	if (onPhone && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file] }).catch(function () {});
  } else {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(file);
    link.download = fileName;
    link.click();
  }
});

// Restore: the visible button opens the hidden file chooser
document.getElementById('restoreButton').addEventListener('click', function () {
  document.getElementById('restoreFile').click();
});

// When a file has been chosen, read it and load it into storage
document.getElementById('restoreFile').addEventListener('change', function (event) {
  const file = event.target.files[0];
  if (!file) {
    return;
  }

  const reader = new FileReader();
  reader.addEventListener('load', function () {
    let data;
    try {
      data = JSON.parse(reader.result);
    } catch (error) {
      data = null;
    }

    if (data === null || typeof data !== 'object') {
      alert('That file is not a tracker backup.');
      return;
    }

    if (!confirm('Replace everything on this device with the backup?')) {
      return;
    }

    const old = [];
	for (let i = 0; i < localStorage.length; i++) {
	  if (!localStorage.key(i).startsWith('sleep-')) {
	    old.push(localStorage.key(i));
	  }
}
old.forEach(function (key) {
  localStorage.removeItem(key);
});
    Object.keys(data).forEach(function (key) {
      localStorage.setItem(key, data[key]);
    });
    location.reload();
  });
  reader.readAsText(file);
});
		
      // When the page first loads
      drawGrid();
      if (reviewing) {
        showMonthEnd();
      }
    </script>
  </body>
</html>
